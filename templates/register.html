{% extends "base.html" %}

{% block title %} DaniBook | Register {% endblock %}

{% block content %}

{% if error %}
  <p>{{error}}</p>
{% endif %}

<form action="{{ url_for('register') }}" method="POST">

  <label for="name">Full Name</label>
  <input id="name" name="user-name" type="text" placeholder="Enter your full name" required>

  <label for="email">Email</label>
  <input id="email" name="user-email" type="email" placeholder="example@email.com" required>

  <label for="password">Password</label>
  <input id="password" name="user-password" type="password" placeholder="Enter a password" minlength="8" required>

  <label for="confirm-password">Confirm Password</label>
  <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm Password" minlength="8" required>

  <button type="submit">Create Account</button>
  
</form>

{% endblock %}
